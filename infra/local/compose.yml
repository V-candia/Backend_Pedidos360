# Entorno completo para pruebas locales SIN Azure/AWS: docker compose up -d --build
# Oracle + RabbitMQ + Zookeeper/Kafka + OIDC falso + 5 microservicios + nginx (fake API Gateway).
x-svc: &svc
  restart: on-failure
  environment: &env
    TENANT_ID: local
    API_CLIENT_ID: pedidos360-local
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/default # = iss de los tokens del mock
    APP_JWK_SET_URI: http://mock-oauth:8080/default/jwks
    DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
    DB_USER: pedidos360
    DB_PASSWORD: pedidos360
    KAFKA_BOOTSTRAP: kafka:9092
    RABBIT_HOST: rabbitmq
    RABBIT_USER: pedidos360
    RABBIT_PASSWORD: pedidos360
    CATALOG_URL: http://catalog:8082

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: pedidos360
      APP_USER_PASSWORD: pedidos360
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["15672:15672"] # UI: pedidos360 / pedidos360
    volumes:
      - ../mq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ../mq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12

  # Alpine + KRaft (sin Zookeeper) solo para pruebas locales; infra/kafka mantiene Zookeeper como pide el caso.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mock-oauth:
    build: { context: ., dockerfile: mock-oauth.Dockerfile } # se publica vía gateway:8080 (agrega CORS)
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG_PATH: /config.json
    volumes:
      - ./mock-oauth.json:/config.json:ro

  catalog:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-catalog } }
    environment:
      <<: *env
      APP_SEED: "true"
    depends_on: { oracle: { condition: service_healthy }, mock-oauth: { condition: service_started } }
    ports: ["8082:8082"]

  orders:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-orders } }
    depends_on:
      oracle: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka: { condition: service_started }
      catalog: { condition: service_started }
    ports: ["8081:8081"]

  notify:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-notify } }
    depends_on: { rabbitmq: { condition: service_healthy } }

  audit:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-audit } }
    depends_on: { oracle: { condition: service_healthy }, kafka: { condition: service_started } }
    ports: ["8084:8084"]

  report:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-report } }
    depends_on: { oracle: { condition: service_healthy }, kafka: { condition: service_started } }
    ports: ["8085:8085"]

  gateway:
    image: nginx:1.27-alpine
    ports: ["8090:80", "8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [orders, catalog, audit, report, mock-oauth]
