# Hace de AWS API Gateway en local: una sola base URL + CORS. El JWT lo validan los microservicios.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;

    if ($request_method = OPTIONS) { return 204; }

    location /api/orders  { set $u http://orders:8081;  proxy_pass $u; }
    location /api/catalog { set $u http://catalog:8082; proxy_pass $u; }
    location /api/audit   { set $u http://audit:8084;   proxy_pass $u; }
    location /api/report  { set $u http://report:8085;  proxy_pass $u; }
}

# Emisor de tokens (mock) con CORS. Conserva el Host original para que el claim iss sea http://localhost:8080/default.
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
    add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;

    if ($request_method = OPTIONS) { return 204; }

    location / {
        set $u http://mock-oauth:8080;
        proxy_pass $u;
        proxy_set_header Host $http_host;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
    }
}
