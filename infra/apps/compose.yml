# ec2-apps. Copiar .env.example a .env y completar.
# Los servicios se hablan por nombre de servicio (catalog); RabbitMQ y Kafka viven en otras EC2 (RABBIT_HOST / KAFKA_BOOTSTRAP).
services:
  orders:
    build: { context: ../.., args: { MODULE: ms-pedidos360-orders } }
    env_file: .env
    environment:
      DB_URL: ${ORDERS_DB_URL}
      DB_USER: ${ORDERS_DB_USER}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      CATALOG_URL: http://catalog:8082
    ports: ["8081:8081"]
    depends_on: [catalog]
    restart: unless-stopped

  catalog:
    build: { context: ../.., args: { MODULE: ms-pedidos360-catalog } }
    env_file: .env
    environment:
      DB_URL: ${CATALOG_DB_URL}
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports: ["8082:8082"]
    restart: unless-stopped

  notify:
    build: { context: ../.., args: { MODULE: ms-pedidos360-notify } }
    env_file: .env
    restart: unless-stopped # sin puerto publicado: solo consume RabbitMQ

  audit:
    build: { context: ../.., args: { MODULE: ms-pedidos360-audit } }
    env_file: .env
    environment:
      DB_URL: ${AUDIT_DB_URL}
      DB_USER: ${AUDIT_DB_USER}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD}
    ports: ["8084:8084"]
    restart: unless-stopped

  report:
    build: { context: ../.., args: { MODULE: ms-pedidos360-report } }
    env_file: .env
    environment:
      DB_URL: ${REPORT_DB_URL}
      DB_USER: ${REPORT_DB_USER}
      DB_PASSWORD: ${REPORT_DB_PASSWORD}
    ports: ["8085:8085"]
    restart: unless-stopped
