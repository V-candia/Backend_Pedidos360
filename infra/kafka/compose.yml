# ec2-kafka (1 broker MVP). Security Group: 9092 solo desde ec2-apps.
# KAFKA_ADVERTISED_HOST = IP privada de esta EC2 (la que usan los servicios en KAFKA_BOOTSTRAP).
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:?definir KAFKA_ADVERTISED_HOST}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3 # los *.DLT se autocrean con 3 particiones, igual que su tópico origen
    restart: unless-stopped
