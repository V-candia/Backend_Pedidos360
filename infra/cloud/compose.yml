# Una sola EC2 (t3.large): docker compose up -d --build   (desde infra/cloud)
# Solo el puerto 80 sale al exterior; API Gateway apunta ahí. Sin mock: los tokens son de Azure AD.
x-svc: &svc
  restart: unless-stopped
  environment: &env
    TENANT_ID: 7d299207-02b5-4afd-9826-5edf22134e00
    API_CLIENT_ID: e17d6c18-3e48-4533-afb4-6c5c0cebe145
    DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
    DB_USER: pedidos360
    DB_PASSWORD: pedidos360 # solo alcanzable dentro de la red de compose; cambiar si se publica el puerto
    KAFKA_BOOTSTRAP: kafka:9092
    RABBIT_HOST: rabbitmq
    RABBIT_USER: pedidos360
    RABBIT_PASSWORD: pedidos360
    CATALOG_URL: http://catalog:8082

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: pedidos360
      APP_USER_PASSWORD: pedidos360
    volumes: [oracle-data:/opt/oracle/oradata]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    volumes:
      - ../mq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ../mq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-data:/var/lib/kafka/data]

  catalog:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-catalog } }
    environment:
      <<: *env
      APP_SEED: "true" # solo siembra si la tabla está vacía
    depends_on: { oracle: { condition: service_healthy } }

  orders:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-orders } }
    depends_on:
      oracle: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka: { condition: service_started }
      catalog: { condition: service_started }

  notify:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-notify } }
    depends_on: { rabbitmq: { condition: service_healthy } }

  audit:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-audit } }
    depends_on: { oracle: { condition: service_healthy }, kafka: { condition: service_started } }

  report:
    <<: *svc
    build: { context: ../.., args: { MODULE: ms-pedidos360-report } }
    depends_on: { oracle: { condition: service_healthy }, kafka: { condition: service_started } }

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [orders, catalog, audit, report]

volumes:
  oracle-data:
  rabbit-data:
  kafka-data:
