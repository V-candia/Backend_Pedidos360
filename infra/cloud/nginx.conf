# Solo enruta por prefijo. CORS y validación del JWT los hace API Gateway; los servicios validan el JWT otra vez.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    # Preflight de CORS: API Gateway agrega los headers, aquí solo hay que devolver 2xx sin pasar por los servicios.
    if ($request_method = OPTIONS) { return 204; }

    location /api/orders  { set $u http://orders:8081;  proxy_pass $u; }
    location /api/catalog { set $u http://catalog:8082; proxy_pass $u; }
    location /api/audit   { set $u http://audit:8084;   proxy_pass $u; }
    location /api/report  { set $u http://report:8085;  proxy_pass $u; }
}
